<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — Secure Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="vault-layout">
        <aside class="sidebar">
            <div class="brand-box">
                <h2>Vault</h2>
            </div>

            <nav class="nav-section">
                <span class="nav-label">ХРАНИЛИЩЕ</span>
                <a href="#" class="nav-item active">
                    <span></span> Все записи
                </a>
                <a href="#" class="nav-item">
                    <span></span> Пароли
                </a>
                <a href="#" class="nav-item">
                    <span></span> Заметки
                </a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="app-header">
                <div class="header-title">
                    <h1>Все элементы хранилища</h1>
                    <span class="badge" id="count-badge">0 записей</span>
                </div>
                <div class="header-actions">
                    <button id="add-btn" class="btn-action btn-add" title="Добавить запись">＋</button>
                    <button id="refresh-btn" class="btn-action">Обновить</button>
                </div>
            </header>

            <div class="content-scroll">
                <div id="vault-list" class="cards-grid">
                    <div class="loading-state">Загрузка данных из базы...</div>
                </div>
            </div>
        </main>
    </div>
    <script src="/static/crypto.js"></script>
    <script src="/static/app.js"></script>
<div id="add-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <div class="modal-header">
            <h3> Новая запись </h3>
            <button id="modal-close" class="modal-close-btn">×</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="input-title">Название</label>
                <input type="text" id="input-title" placeholder="Например: Почта, Пароль от Wi-Fi...">
            </div>
            <div class="form-group">
                <label for="input-secret">Секрет / Данные</label>
                <textarea id="input-secret" placeholder="Текст секрета, пароль или заметка..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button id="modal-save" class="btn-action">Сохранить</button>
        </div>
    </div>
</div>
</body>
</html>
